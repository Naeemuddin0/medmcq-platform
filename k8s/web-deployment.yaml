apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  labels:
    app: medmcq-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medmcq-web
  template:
    metadata:
      labels:
        app: medmcq-web
    spec:
      containers:
        - name: medmcq-web
          image: medmcq-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: MONGODB_URI
              value: "mongodb://mongo-service:27017/medmcq-db"
            - name: NEXTAUTH_SECRET
              value: "pm9DuqTQZ8LuUKDpDvGpGExQPIaohQW9RHbxoVWaCzQ="
            - name: NEXTAUTH_URL
              value: "http://localhost:3000"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
